    <h1 class="mt-4 text-3xl font-bold text-white">빠른 확대/축소</h1>
    <p class="mt-3 text-neutral-400">트랙패드로 핀치 줌을 하거나 메뉴에서 배율을 고르는 대신, 키 하나로 원하는 배율로 즉시 전환합니다.</p>

    <table class="mt-6 w-full border-collapse text-sm">
      <tbody class="divide-y divide-white/10">
        <tr><td class="py-3 pr-4"><span class="kbd">zi</span></td><td class="py-3 text-neutral-400">확대</td></tr>
        <tr><td class="py-3 pr-4"><span class="kbd">zo</span></td><td class="py-3 text-neutral-400">축소</td></tr>
        <tr><td class="py-3 pr-4"><span class="kbd">z0</span></td><td class="py-3 text-neutral-400">실제 크기(100%)</td></tr>
        <tr><td class="py-3 pr-4"><span class="kbd">zh</span></td><td class="py-3 text-neutral-400">가로 폭에 맞춤</td></tr>
        <tr><td class="py-3 pr-4"><span class="kbd">zv</span> / <span class="kbd">zz</span></td><td class="py-3 text-neutral-400">세로 높이에 맞춤</td></tr>
        <tr><td class="py-3 pr-4"><span class="kbd">Cmd</span>+<span class="kbd">+</span> / <span class="kbd">Cmd</span>+<span class="kbd">-</span></td><td class="py-3 text-neutral-400">확대 / 축소</td></tr>
      </tbody>
    </table>

    <p class="mt-8 text-neutral-400">긴 논문은 <span class="kbd">zh</span>로 폭을 맞춰 읽다가, 표나 그림이 나오면 <span class="kbd">zv</span>로 한 페이지를 통째로 보고, 발표할 때는 <span class="kbd">p</span>로 프레젠테이션 모드에 들어가는 식으로 상황에 맞게 바로바로 전환할 수 있습니다.</p>
