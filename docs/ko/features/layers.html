    <h1 class="mt-4 text-3xl font-bold text-white">레이어(옵셔널 콘텐츠)</h1>
    <p class="mt-3 text-neutral-400">PDF는 옵셔널 콘텐츠 그룹(OCG)을 담을 수 있습니다 — Acrobat에서 CAD 도면, GIS 내보내기, 다국어 문서를 열면 보이는 "레이어" 패널이 바로 그것입니다. Vimong도 똑같은 패널을 제공합니다: 레이어가 있는 문서를 열면 사이드바에 <span class="kbd">레이어</span> 탭이 자동으로 나타나고, 레이어마다 체크박스로 표시 여부를 바꿀 수 있습니다.</p>
    <img src="../../assets/layers-sample.png" alt="중첩 트리를 보여주는 레이어 패널 — Map Frame 안에 Data Source Attribution과 Map이 있고, Map 안에 Light Gray Base가, 최상위에 Scale Bar와 North Arrow가 있음" class="mt-4 rounded-xl border border-white/10">
